[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "square-glauber"
version = "0.1.0"
description = "Auditable local pilot for random-bond square-grid dimers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
test = ["pytest>=8"]
accel = ["numba>=0.61"]

[project.scripts]
square-glauber = "square_glauber.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: optional statistical integration tests",
]
