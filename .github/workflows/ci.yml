name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  julia:
    name: Julia ${{ matrix.julia-version }} package check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1.10', '1']
    defaults:
      run:
        working-directory: research-julia
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v2
      - name: Remove Julia 1.12-generated manifest for Julia 1.10
        if: matrix.julia-version == '1.10'
        run: rm -f Manifest.toml
      - run: julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'
      - run: julia --project=. -e 'using LERWResearch; @assert LERWResearch.stable_seed("ci", 1) == LERWResearch.stable_seed("ci", 1)'
