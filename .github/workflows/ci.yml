name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  square-glauber:
    name: Square-grid Python tests (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: square_glauber_python/pyproject.toml
      - name: Install package, tests, and acceleration backend
        run: python -m pip install -e './square_glauber_python[test,accel]'
      - name: Mathematical and workflow tests
        run: python -m pytest square_glauber_python/tests
      - name: Exact tiny-grid validation
        run: python -m square_glauber.cli validate-exact

  aztec:
    name: Aztec-diamond tests (Julia ${{ matrix.julia-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1.10', '1']
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v2
      - name: Unit and mathematical-reference tests
        run: julia --project=aztec -e 'using Pkg; Pkg.test()'
      - name: Command-line smoke workflows
        run: sh aztec/test/smoke_workflows.sh
